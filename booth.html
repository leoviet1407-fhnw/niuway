<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174a5b">
<meta name="robots" content="noindex">
<title>C5Z Check-in · niuway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>/* C5Z booth check-in — niuway design system, laid out for one-handed use
   on a phone at a counter: big targets, no scrolling to confirm. */
:root{
  --nw:#174a5b; --bg:#174a5b; --card:#fff; --tp:#fff; --ts:rgba(255,255,255,.72);
  --tl:rgba(255,255,255,.15); --toc:#1c1c1a; --tocs:#6b6b66; --line:rgba(0,0,0,.10);
  --err:#b3261e; --ok:#2f9e57; --radius:12px;
  --t-regular:#b96c9c; --t-basic:#d9a21f; --t-plus:#4f8f57;
  --font:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); font-family:var(--font); color:var(--tp)}
button{font-family:var(--font)}
:focus-visible{outline:2px solid #fff; outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; width:100%; min-height:100vh;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(2rem + env(safe-area-inset-bottom,0px))}

.header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:.5rem 0 1rem}
.brand{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700}
.brand-logo{height:20px; width:auto; display:block}
.ghost{background:none; border:1px solid rgba(255,255,255,.35); color:rgba(255,255,255,.9);
  border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer}
.ghost:hover{border-color:#fff; color:#fff}

.card{background:var(--card); color:var(--toc); border-radius:var(--radius); overflow:hidden}
.find,.pincard{padding:18px}
.find{overflow:visible; position:relative; z-index:5}   /* the dropdown escapes the card */
.pincard{margin-bottom:12px}
.pincard label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px}
.release.arm{border-color:var(--err); color:var(--err); font-weight:700}
.find label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px}
input{width:100%; padding:13px 12px; border-radius:8px; border:1px solid rgba(0,0,0,.15);
  font-family:var(--font); font-size:17px; color:var(--toc); background:#fff}
input:focus{outline:none; border-color:var(--nw); box-shadow:0 0 0 2px rgba(23,74,91,.15)}
.invalid input{border-color:var(--err)}
.typeahead{position:relative}
.hits{position:absolute; z-index:20; left:0; right:0; top:calc(100% + 4px); margin:0; padding:6px;
  list-style:none; background:#fff; border:1px solid var(--line); border-radius:10px;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.35); max-height:16rem; overflow-y:auto}
.hits li{margin:0}
.hits li+li{border-top:1px solid var(--line)}
.hits button{display:grid; grid-template-columns:1fr auto; gap:2px 10px; width:100%;
  text-align:left; padding:11px 12px; border:0; border-radius:8px; background:none;
  cursor:pointer; min-height:52px; align-items:center}
.hits button:hover,.hits button:focus-visible{background:#eef4f5; outline:none}
.h-name{grid-column:1; font-size:15.5px; font-weight:700; color:var(--nw); line-height:1.2}
.h-mail{grid-column:1; font-size:12.5px; color:var(--tocs); word-break:break-all; line-height:1.3}
.h-what{grid-column:2; grid-row:1 / span 2; font-size:11.5px; font-weight:600; color:var(--tocs);
  background:#eef2f3; border-radius:999px; padding:4px 9px; white-space:nowrap}
.hits mark{background:#fdf0c8; color:inherit; border-radius:2px; padding:0 1px}

.primary{display:block; width:100%; margin-top:12px; padding:14px; border:1px solid var(--nw);
  border-radius:var(--radius); background:var(--nw); color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; min-height:50px}
.primary:hover{background:#1c586d}
.primary:disabled{opacity:.55; cursor:default}
.msg{margin:10px 0 0; font-size:13px; color:var(--tocs); min-height:1em}
.msg.bad{color:var(--err); font-weight:600}
.msg.good{color:var(--ok); font-weight:600}

#out{display:flex; flex-direction:column; gap:12px; margin-top:12px}
.guest-hd{padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.kind{display:inline-flex; align-items:center; gap:8px; font-size:20px; font-weight:700; color:var(--nw)}
.kind i{width:14px; height:14px; border-radius:3px; background:var(--sw)}
.k-Regular{--sw:var(--t-regular)} .k-Basic{--sw:var(--t-basic)} .k-Plus{--sw:var(--t-plus)}
.order{font-size:11.5px; color:var(--tocs); font-variant-numeric:tabular-nums}

.sect{padding:14px 18px; border-bottom:1px solid var(--line)}
.sect:last-child{border-bottom:0}
.sect h3{margin:0 0 9px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--tocs)}
.addons{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.addons li{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600}
.qty{min-width:34px; text-align:center; padding:3px 8px; border-radius:6px; background:#eef2f3;
  color:var(--nw); font-weight:700; font-variant-numeric:tabular-nums}
.none{margin:0; font-size:14px; color:var(--tocs)}

.nums{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin:0; padding:0;
  list-style:none}
.num{padding:12px 4px; border:1px solid var(--line); border-radius:8px; background:#fff;
  font-size:18px; font-weight:700; color:var(--nw); cursor:pointer; font-variant-numeric:tabular-nums;
  min-height:48px}
.num:hover{border-color:var(--nw); background:#f2f7f8}
.num.taken{background:repeating-linear-gradient(135deg,#fafafa,#fafafa 5px,#f0f0ee 5px,#f0f0ee 10px);
  color:#b3b3ad; cursor:default; border-style:dashed}
.num.held{background:#fff7e6; border-color:#d9a21f; color:#8a6400; cursor:default}
.num.mine{background:#eaf7ef; border-color:var(--ok); color:#1d6b3a}

.confirm{border:1px solid var(--nw); border-radius:10px; padding:14px; background:#f2f7f8}
.c-q{margin:0; font-size:17px; font-weight:700; color:var(--nw)}
.c-q b{font-size:22px}
.c-w{margin:3px 0 12px; font-size:13px; color:var(--tocs); word-break:break-all}
.c-btns{display:flex; gap:8px}
.c-btns .primary{margin:0; flex:2}
.ghost.dark{flex:1; border-color:rgba(0,0,0,.2); color:var(--tocs); background:#fff;
  border-radius:var(--radius); min-height:50px; font-size:15px}
.ghost.dark:hover{border-color:var(--err); color:var(--err)}
.who{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.who li{display:flex; align-items:baseline; gap:10px; font-size:13.5px;
  padding-bottom:6px; border-bottom:1px solid var(--line)}
.who li:last-child{border-bottom:0}
.who b{min-width:38px; font-size:16px; color:var(--nw); font-variant-numeric:tabular-nums}
.who span{flex:1; word-break:break-all; color:var(--toc)}
.who i{font-style:normal; font-size:11px; color:var(--tocs)}
.gname{font-size:17px; font-weight:700; color:var(--nw); width:100%}
.tally{font-size:14px; font-weight:600; color:var(--tocs)}
.tally.all{color:var(--ok)}
.pickup{background:#fff8e8}
.pickup h3{color:#8a6400}
.addons.big li{font-size:17px}
.addons.big .qty{background:#f6e2b8; color:#7a5600; font-size:16px; min-width:40px; padding:5px 9px}
.given{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.given .num{min-width:64px}
.num.arm{background:#fdecec; border-color:var(--err); color:var(--err); font-size:13px}
.pick{margin:0 0 8px; font-size:12.5px; color:var(--tocs); font-weight:600}
.none.warn{color:var(--err); font-weight:600}
.sect h3{display:flex; align-items:center; gap:8px; text-transform:none; font-size:13px;
  letter-spacing:0; color:var(--toc)}
.sect h3 .kind{font-size:13px}
.done{padding:18px; text-align:center}
.done .big{margin:0; font-size:56px; line-height:1; font-weight:700; color:var(--ok);
  font-variant-numeric:tabular-nums}
.done p{margin:8px 0 0; font-size:14px; color:var(--tocs)}
.done .primary{margin-top:14px}
.release{margin-top:10px; width:100%; padding:11px; border-radius:8px; background:none;
  border:1px solid var(--line); color:var(--tocs); font-size:13px; font-weight:600; cursor:pointer}
.release:hover{border-color:var(--err); color:var(--err)}

.board{margin-top:12px}
.board-hd{padding:12px 18px; border-bottom:1px solid var(--line); display:flex;
  justify-content:space-between; align-items:baseline; gap:10px; font-size:14px}
.board-hd span{font-size:12px; color:var(--tocs)}
.board .grp{padding:12px 18px; border-bottom:1px solid var(--line)}
.board .grp:last-child{border-bottom:0}
.board .grp h4{margin:0 0 8px; font-size:12px; font-weight:700; color:var(--nw);
  display:flex; align-items:center; gap:7px}
.board .grp h4 i{width:12px; height:12px; border-radius:3px; background:var(--sw)}

.foot{margin-top:1.5rem; padding-top:.9rem; border-top:1px solid var(--tl);
  font-size:11.5px; line-height:1.6; color:var(--ts)}
.foot p{margin:0}
.link{background:none; border:0; padding:0; color:#fff; font-size:11.5px; font-weight:600;
  text-decoration:underline; cursor:pointer}
</style>
</head>

/* C5Z booth check-in. Staff-facing, German only — the booth is German-speaking.
   Addresses are hashed before anything else happens; none are in this page. */
(function(){
"use strict";
var TENTS=DATA.tents, BOOK=DATA.book, SALT=DATA.salt, TYPES=DATA.types;
var ASSIGN={}, NAMED=false, hit=null, hitHash=null, hitMail="", pending=null;

function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function say(t,cls){var m=el("msg"); m.textContent=t; m.className="msg"+(cls?" "+cls:"");}

/* --- the staff pin: kept on the device, checked on the server --------------
   A field rather than window.prompt, which phone browsers like to suppress. */
function pin(){ try{ return localStorage.getItem("nw-pin")||""; }catch(e){ return ""; } }
function showPin(){ el("pinState").textContent = pin() ? "PIN gesetzt" : "kein PIN"; }
function askPin(why, then){
  pending = then || null;
  el("pinMsg").textContent = why || "";
  el("pinMsg").className = "msg" + (why ? " bad" : "");
  el("pincard").hidden = false;
  el("pinInput").value = pin();
  el("pincard").scrollIntoView({behavior:"smooth", block:"center"});
  el("pinInput").focus();
}
el("pincard").addEventListener("submit",function(ev){
  ev.preventDefault();
  var v=String(el("pinInput").value).trim();
  if(!v){ el("pinMsg").textContent="Bitte den PIN eingeben."; el("pinMsg").className="msg bad"; return; }
  try{ localStorage.setItem("nw-pin", v); }catch(e){}
  showPin();
  el("pincard").hidden = true;
  el("pinMsg").textContent = "";
  var go=pending; pending=null;
  if(go) go();
});
el("pinBtn").addEventListener("click",function(){ askPin("", null); });

/* --- the board ------------------------------------------------------------ */
function load(){
  var q = pin() ? "?pin="+encodeURIComponent(pin()) : "";   // addresses need the pin
  return fetch("api/assign"+q,{headers:{Accept:"application/json"}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ ASSIGN=(j&&j.assign)||{}; NAMED=!!(j&&j.named); })
    .catch(function(){ ASSIGN={}; NAMED=false; });
}
function post(body){
  body.pin = pin();
  return fetch("api/assign",{method:"POST",headers:{"Content-Type":"application/json"},
                             body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok){ var e=new Error(j.error||r.status); e.code=r.status; e.body=j; throw e; }
      return j; }); });
}
function freeOf(kind){
  return TENTS.filter(function(t){ return t.t===kind && !t.r && !ASSIGN[t.no]; });
}

/* --- type-ahead ----------------------------------------------------------
   The page has no addresses, so matching happens on the server, behind the
   pin. Two letters is enough; the endpoint puts prefix matches first. ------ */
var hitsTimer=null, hitsSeq=0;
function closeHits(){
  el("hits").hidden=true; el("hits").innerHTML="";
  el("email").setAttribute("aria-expanded","false");
}
function mark(text,q){                    // show why a row matched
  var i=text.toLowerCase().indexOf(q);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function showHits(list,q){
  if(!list.length) return closeHits();
  el("hits").innerHTML=list.map(function(r){
    var mail=r.m||r, name=r.n||"", what=r.k||"";
    return '<li role="option"><button type="button" data-mail="'+esc(mail)+'">'+
      (name?'<span class="h-name">'+mark(name,q)+'</span>':'')+
      '<span class="h-mail">'+mark(mail,q)+'</span>'+
      (what?'<span class="h-what">'+esc(what)+'</span>':'')+
      '</button></li>';
  }).join("");
  el("hits").hidden=false;
  el("email").setAttribute("aria-expanded","true");
  [].forEach.call(el("hits").querySelectorAll("button"),function(b){
    b.addEventListener("click",function(){
      el("email").value=b.getAttribute("data-mail");
      closeHits();
      el("find").requestSubmit();
    });
  });
}
function search(q){
  if(!pin() || q.length<2) return closeHits();
  var seq=++hitsSeq;
  fetch("api/directory?pin="+encodeURIComponent(pin())+"&q="+encodeURIComponent(q))
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ if(seq===hitsSeq) showHits((j&&j.matches)||[], q); })
    .catch(closeHits);
}
el("email").addEventListener("input",function(){
  var q=el("email").value.trim().toLowerCase();
  clearTimeout(hitsTimer);
  hitsTimer=setTimeout(function(){ search(q); }, 140);
});
el("email").addEventListener("blur",function(){ setTimeout(closeHits, 180); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeHits(); });

/* --- lookup --------------------------------------------------------------- */
el("find").addEventListener("submit",function(ev){
  ev.preventDefault();
  var mail=String(el("email").value).trim().toLowerCase();
  el("out").innerHTML=""; hit=null; hitHash=null;
  el("find").classList.remove("invalid");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){
    el("find").classList.add("invalid"); return say("Keine gültige E-Mail-Adresse.","bad");
  }
  var h=sha256(SALT+mail), b=BOOK[h];
  if(!b){
    el("find").classList.add("invalid");
    return say("Keine C5Z-Buchung zu dieser Adresse.","bad");
  }
  hit=b; hitHash=h; hitMail=mail; confirming=null; closeHits(); say("");
  load().then(render);
});

/* --- the guest card ------------------------------------------------------- */
function poolOf(no){
  for(var i=0;i<TENTS.length;i++) if(TENTS[i].no===no) return TENTS[i].t;
  return null;
}
function minePerPool(){
  var out={};
  Object.keys(ASSIGN).forEach(function(no){
    if(ASSIGN[no].h!==hitHash) return;
    var p=poolOf(no)||"?";
    (out[p]=out[p]||[]).push(no);
  });
  Object.keys(out).forEach(function(p){ out[p].sort(function(a,b){return a-b;}); });
  return out;
}
var confirming=null;
function render(){
  if(!hit) return;
  var mine=minePerPool(), L=hit.t, done=0, want=0, blocks="";

  TYPES.forEach(function(pool){
    var booked=L[pool]||0;
    if(!booked) return;
    var got=mine[pool]||[];
    want+=booked; done+=Math.min(got.length,booked);
    var chips=got.map(function(no){
      return '<button type="button" class="num mine" data-rel="'+esc(no)+'" '+
             'title="Antippen zum Freigeben">'+esc(no)+'</button>';
    }).join("");
    var open=booked-got.length;
    var free=freeOf(pool);
    var picker="";
    if(confirming && confirming.pool===pool){
      picker = '<div class="confirm"><p class="c-q">Zelt <b>'+esc(confirming.no)+'</b> vergeben?</p>'+
        '<p class="c-w">'+esc(pool)+' · '+esc(hitMail)+'</p>'+
        '<div class="c-btns"><button type="button" class="primary" id="okBtn">Bestätigen</button>'+
        '<button type="button" class="ghost dark" id="noBtn">Abbrechen</button></div></div>';
    } else if(open>0){
      picker = free.length
        ? '<p class="pick">Noch '+open+' zu vergeben — '+free.length+' frei:</p><ul class="nums">'+
          free.map(function(t){ return '<li><button type="button" class="num" data-no="'+
            esc(t.no)+'" data-pool="'+esc(pool)+'">'+esc(t.no)+'</button></li>'; }).join("")+'</ul>'
        : '<p class="none warn">Keine freien '+esc(pool)+'-Zelte mehr.</p>';
    }
    blocks += '<div class="sect"><h3><span class="kind k-'+esc(pool)+'"><i></i>'+esc(pool)+
      '</span> · '+booked+(booked>1?' Zelte':' Zelt')+'</h3>'+
      (chips?'<div class="given">'+chips+'</div>':'')+picker+'</div>';
  });

  var pick = (hit.p && hit.p.length)
    ? '<div class="sect pickup"><h3>Abholen — jetzt mitgeben</h3><ul class="addons big">'+
      hit.p.map(function(a){
        return '<li><span class="qty">'+a[1]+'×</span>'+esc(a[0])+'</li>'; }).join("")+'</ul></div>'
    : '<div class="sect pickup"><h3>Abholen</h3><p class="none">Nichts abzuholen.</p></div>';

  el("out").innerHTML =
    '<article class="card">'+
      '<div class="guest-hd">'+
        (hit.n?'<span class="gname">'+esc(hit.n)+'</span>':'')+
        '<span class="tally'+(done===want?' all':'')+'">'+
        (want ? done+' von '+want+(want>1?' Zelten':' Zelt')+' vergeben'
              : 'Nur Abholung — kein Stellplatz')+'</span>'+
        (hit.o?'<span class="order">Bestellung '+esc(hit.o)+'</span>':'')+'</div>'+
      pick+
      blocks+
      '<div class="sect"><button type="button" class="primary" id="next">Nächster Gast</button></div>'+
    '</article>';

  [].forEach.call(el("out").querySelectorAll(".num[data-no]"),function(b){
    b.addEventListener("click",function(){
      confirming={no:b.getAttribute("data-no"), pool:b.getAttribute("data-pool")};
      render();
    });
  });
  if(confirming){
    el("okBtn").addEventListener("click",function(){
      var c=confirming; confirming=null; assign(c.no, el("okBtn"));
    });
    el("noBtn").addEventListener("click",function(){ confirming=null; say(""); render(); });
  }
  [].forEach.call(el("out").querySelectorAll(".num[data-rel]"),function(b){
    b.addEventListener("click",function(){ release(b.getAttribute("data-rel"), b); });
  });
  el("next").addEventListener("click",function(){
    hit=null; hitHash=null; el("out").innerHTML=""; el("email").value=""; say(""); el("email").focus();
  });
  board();
}

function assign(no, btn){
  if(!pin()) return askPin("PIN eingeben, dann wird Zelt "+no+" vergeben.",
                           function(){ assign(no, btn); });
  btn.disabled=true; say("Wird vergeben …");
  post({tent:no, hash:hitHash, mail:hitMail, by:""})
    .then(function(){ ASSIGN[no]={h:hitHash,at:Date.now(),m:hitMail};
                      say("Zelt "+no+" vergeben.","good"); render(); })
    .catch(function(e){
      btn.disabled=false;
      if(e.code===401) { say(""); askPin("PIN falsch — nochmal versuchen.", function(){ assign(no, btn); }); }
      else if(e.code===409){ say("Zelt "+no+" ist schon vergeben.","bad"); load().then(render); }
      else if(e.code===503){ say(e.body&&e.body.hint||"Kein Speicher konfiguriert.","bad"); }
      else say("Hat nicht geklappt: "+e.message,"bad");
    });
}

var arming=null;
function release(no, btn){
  if(arming!==no){
    arming=no; btn.classList.add("arm"); btn.textContent=no+" freigeben?";
    setTimeout(function(){ if(arming===no){ arming=null; render(); } }, 4000);
    return;
  }
  arming=null;
  if(!pin()) return askPin("PIN eingeben, dann wird Zelt "+no+" freigegeben.",
                           function(){ arming=no; release(no, btn); });
  post({tent:no, release:true})
    .then(function(){ delete ASSIGN[no]; say("Zelt "+no+" ist wieder frei.","good"); render(); })
    .catch(function(e){
      if(e.code===401){ say(""); askPin("PIN falsch — nochmal versuchen.", null); }
      else say("Hat nicht geklappt: "+e.message,"bad");
    });
}

/* --- occupancy board ------------------------------------------------------ */
function board(){
  var total=0, taken=0, body="";
  var given=Object.keys(ASSIGN).sort(function(a,b){return a-b;});
  if(given.length){
    body += '<div class="grp"><h4>Vergeben · '+given.length+'</h4><ul class="who">'+
      given.map(function(no){
        var r=ASSIGN[no];
        return '<li><b>'+esc(no)+'</b><span>'+esc(r.m || (NAMED?"—":"PIN eingeben für Namen"))+
               '</span><i>'+esc(poolOf(no)||"")+'</i></li>';
      }).join("")+'</ul></div>';
  }
  TYPES.forEach(function(kind){
    var all=TENTS.filter(function(t){ return t.t===kind; });
    var chips=all.map(function(t){
      var cls="num", label=t.no;
      if(t.r){ cls+=" held"; label=t.no+" "+t.r; }
      else if(ASSIGN[t.no]){ cls+=(ASSIGN[t.no].h===hitHash?" mine":" taken"); }
      if(!t.r){ total++; if(ASSIGN[t.no]) taken++; }
      return '<li><span class="'+cls+'" style="display:block">'+esc(label)+'</span></li>';
    }).join("");
    body+='<div class="grp"><h4 class="k-'+kind+'"><i></i>'+kind+'</h4><ul class="nums">'+chips+'</ul></div>';
  });
  el("boardBody").innerHTML=body;
  el("boardSum").textContent=taken+" von "+total+" vergeben";
}
el("boardBtn").addEventListener("click",function(){
  var b=el("board");
  b.hidden=!b.hidden;
  if(!b.hidden){ load().then(function(){ board(); b.scrollIntoView({behavior:"smooth",block:"start"}); }); }
});

showPin();
if(!pin()) el("pincard").hidden = false;      // first use on this device
load().then(board);
})();
</script>
