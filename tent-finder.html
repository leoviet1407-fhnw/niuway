<!-- niuway tent finder · Rev 2 · 2026-09-02 · 56 tents -->
<title>Tent Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>/* Zeltfinder — niuway design system (niuway.vercel.app):
   Barlow, teal ground #174a5b, white cards at 12px radius, DE over EN.
   Tent colours are the ones on the Aufbauten drawings:
   mauve = Regular, yellow = Large, green = EXTRA Large. */
:root{
  --nw:#174a5b; --bg:#174a5b; --card:#ffffff;
  --tp:#ffffff; --ts:rgba(255,255,255,0.72); --tl:rgba(255,255,255,0.15);
  --toc:#1c1c1a; --tocs:#6b6b66; --line:rgba(0,0,0,0.10);
  --err:#b3261e; --radius:12px;
  --m-r:#b96c9c; --m-l:#d9a21f; --m-x:#4f8f57;
  --field:#eceff0;
  --font:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; background:var(--bg); font-family:var(--font); color:var(--tp); overflow-x:hidden}
img{max-width:100%}
button{font-family:var(--font); font-size:16px}
:focus-visible{outline:2px solid #fff; outline-offset:2px}

.wrap{max-width:480px; width:100%; margin:0 auto; min-height:100vh;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(2rem + env(safe-area-inset-bottom,0px))}

/* header ---------------------------------------------------------------- */
.header{display:flex; align-items:center; justify-content:space-between; padding:.75rem 0 1.25rem}
.brand-logo{height:22px; width:auto; display:block}
.lang{display:flex; gap:2px; padding:2px; border-radius:999px; background:rgba(255,255,255,0.14)}
.lang button{
  border:0; background:none; color:var(--ts); cursor:pointer; padding:5px 11px;
  border-radius:999px; font-size:12.5px; font-weight:600; letter-spacing:.02em;
  min-height:30px; touch-action:manipulation;
}
.lang button[aria-pressed="true"]{background:#fff; color:var(--nw)}

h1{font-size:22px; font-weight:700; margin:0 0 6px; color:var(--tp); letter-spacing:-.2px}
.intro{margin:0 0 1.25rem; font-size:13.5px; line-height:1.5; color:var(--ts); max-width:36ch}

/* search card ----------------------------------------------------------- */
.card{background:var(--card); border-radius:var(--radius); color:var(--toc); overflow:hidden}
.finder{padding:20px 18px 18px}
.finder label{display:block; font-size:12.5px; font-weight:600; color:var(--toc); margin-bottom:5px}
.finder input{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid rgba(0,0,0,0.15);
  font-family:var(--font); font-size:16px; color:var(--toc); background:#fff;
}
.finder input:focus{outline:none; border-color:var(--nw); box-shadow:0 0 0 2px rgba(23,74,91,.15)}
.finder.invalid input{border-color:var(--err)}
.submit{
  display:block; width:100%; margin-top:12px; padding:12px; border-radius:var(--radius);
  background:var(--nw); border:1px solid var(--nw); color:#fff; font-weight:600;
  cursor:pointer; min-height:46px; touch-action:manipulation;
}
.submit:hover{background:#1c586d}
.msg{margin:10px 0 0; font-size:12.5px; line-height:1.45; color:var(--tocs); min-height:1em}
.msg.bad{color:var(--err)}

/* result ---------------------------------------------------------------- */
#out{display:flex; flex-direction:column; gap:12px; margin-top:12px}
#out:empty{margin:0}
.res-hd{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 18px; border-bottom:1px solid var(--line)}
.model{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--nw)}
.model i{width:12px; height:12px; border-radius:2px; background:var(--sw); flex:0 0 auto}
.model.is-tbd{color:var(--tocs)}
.idx{font-size:11.5px; font-weight:500; color:var(--tocs); text-align:right}
.tent-eyebrow{margin:0; padding:14px 18px 0; font-size:11px; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--tocs)}
.is-pickup .tent-eyebrow{color:var(--nw)}
.is-pickup{outline:2px solid var(--nw); outline-offset:-2px}
.tent-no{margin:0; padding:2px 18px 0; font-size:56px; line-height:1; font-weight:700;
  color:var(--nw); letter-spacing:-1.5px; font-variant-numeric:tabular-nums}
.tent-sub{margin:0; padding:6px 18px 16px; font-size:12.5px; color:var(--tocs)}
.facts{margin:0; display:grid; grid-template-columns:1fr; border-top:1px solid var(--line)}
.facts>div{padding:11px 18px; border-right:1px solid var(--line)}
.facts>div:last-child{border-right:0}
.facts dt{margin:0 0 2px; font-size:11px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--tocs)}
.facts dd{margin:0; font-size:19px; font-weight:700; color:var(--nw);
  font-variant-numeric:tabular-nums; line-height:1.15}
.facts dd small{font-size:12.5px; font-weight:400; color:var(--tocs)}
.facts dd.sm{font-size:13.5px; font-weight:600; line-height:1.3}

.map{margin:0; padding:14px 18px 16px; border-top:1px solid var(--line)}
.map figcaption{margin-top:10px; font-size:12.5px; line-height:1.5; color:var(--tocs)}
.planbtn{display:block; width:100%; padding:0; border:1px solid var(--line); border-radius:8px;
  overflow:hidden; background:#fff; cursor:zoom-in; touch-action:manipulation}
.planbtn:hover{border-color:var(--nw)}

.lightbox{display:none; position:fixed; inset:0; background:rgba(10,20,24,.94); z-index:1000;
  align-items:center; justify-content:center; padding:20px}
.lightbox.active{display:flex}
body.locked{overflow:hidden}
#lbBody{width:100%; max-width:900px; display:flex; align-items:center; justify-content:center}

.lb-close{position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,.15); border:none; color:#fff; font-size:22px; line-height:1;
  cursor:pointer; display:flex; align-items:center; justify-content:center}

.spec{margin:0; padding:0 18px 16px; border-top:1px solid var(--line);
  display:flex; flex-wrap:wrap; gap:0 22px}
.spec>div{padding-top:12px; min-width:6.5rem}
.spec dt{margin:0 0 1px; font-size:11px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--tocs)}
.spec dd{margin:0; font-size:13.5px; color:var(--toc); font-variant-numeric:tabular-nums}

.again{
  width:100%; padding:12px; border-radius:var(--radius); background:transparent;
  border:1px solid rgba(255,255,255,0.35); color:rgba(255,255,255,0.85);
  font-weight:600; cursor:pointer; min-height:46px; touch-action:manipulation;
}
.again:hover{border-color:#fff; color:#fff}

.addon{
  margin:0; padding:16px 18px; border-top:1px solid var(--line);
  background:linear-gradient(180deg,#f3f7f8,#eef4f5);
  font-size:16px; line-height:1.4; font-weight:700; color:var(--nw);
  letter-spacing:-.1px; display:flex; gap:10px; align-items:flex-start;
}
.addon::before{
  content:"\2713"; flex:0 0 auto; width:22px; height:22px; border-radius:50%;
  background:var(--nw); color:#fff; font-size:13px; line-height:22px; text-align:center;
  font-weight:700;
}

.addon-top{
  margin:14px 0 0; border:1px solid rgba(255,255,255,.28); border-radius:var(--radius);
  background:rgba(255,255,255,.1); color:#fff; font-size:16px; padding:15px 16px;
}
.addon-top::before{background:#fff; color:var(--nw)}

.checkin{
  display:block; width:calc(100% - 36px); margin:0 18px 16px; padding:13px;
  border:0; border-radius:8px; background:#2f9e57; color:#fff;
  font-size:15px; font-weight:700; cursor:pointer; min-height:46px;
}
.checkin:hover{background:#288a4b}
.checkin:disabled{opacity:.6; cursor:default}
.checked{
  margin:0 18px 10px; padding:12px 13px; border-radius:8px;
  background:#eaf7ef; border:1px solid #2f9e57; color:#1d6b3a;
  font-size:15px; font-weight:700; text-align:center;
}
.checked::before{content:"\2713  "}
.checked.out{margin-bottom:16px; background:#fdecea; border-color:#c0392b; color:#a3271b}
.remind{
  margin:0 18px 10px; padding:0 2px; font-size:13px; line-height:1.45; color:var(--tocs);
  display:flex; gap:8px; align-items:flex-start;
}
.remind::before{content:"\2139"; flex:0 0 auto; font-size:13px; color:var(--nw); font-weight:700}
.checkout{
  display:block; width:calc(100% - 36px); margin:0 18px 16px; padding:12px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--tocs);
  font-size:14px; font-weight:600; cursor:pointer; min-height:44px;
}
.checkout:hover{border-color:#c0392b; color:#a3271b}
.leave{margin:0 18px 16px; padding:14px; border:1px solid #c0392b; border-radius:8px;
  background:#fdecea}
.leave-q{margin:0 0 12px; font-size:14px; font-weight:700; color:#a3271b; line-height:1.4}
.leave-btns{display:flex; gap:8px}
.leave-btns .checkout{margin:0; width:auto; flex:2; background:#c0392b; border-color:#c0392b;
  color:#fff; font-weight:700; font-size:15px}
.leave-btns .checkout:hover{background:#a3271b; color:#fff}
.leave-no{flex:1; padding:12px; border:1px solid rgba(0,0,0,.15); border-radius:8px;
  background:#fff; color:var(--tocs); font-size:14px; font-weight:600; cursor:pointer}

.route{display:block; margin:0 18px 16px; padding:11px 12px; border-radius:8px;
  border:1px solid var(--nw); color:var(--nw); text-decoration:none; text-align:center;
  font-size:13.5px; font-weight:600}
.route:hover{background:var(--nw); color:#fff}
.route::after{content:" \2197"}

/* overview -------------------------------------------------------------- */
.ov{padding:14px 18px 16px}
.ov-site+.ov-site{margin-top:16px}
.ov-site h3{margin:0 0 8px; font-size:13px; font-weight:700; color:var(--nw)}
.ov-site h3 span{font-weight:500; color:var(--tocs)}
.chips{list-style:none; margin:0; padding:0; display:grid; gap:6px;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.chip{border:1px solid var(--line); border-left:4px solid #cfd6d8; border-radius:6px;
  padding:6px 8px; display:flex; flex-direction:column; gap:1px; background:#fbfbfa}
.chip.is-in{border-color:#2f9e57; border-left-color:#2f9e57; background:#eaf7ef}
.chip.is-in b{color:#1d6b3a}
.chip.is-out{border-color:#c0392b; border-left-color:#c0392b; background:#fdecea}
.chip.is-out b{color:#a3271b}
.chip.is-out span{color:#a3271b}
.chip b{font-size:16px; font-weight:700; color:var(--nw); font-variant-numeric:tabular-nums}
.chip span{font-size:10px; line-height:1.25; color:var(--tocs)}
.chip.is-free{background:repeating-linear-gradient(135deg,#fff,#fff 5px,#f2f2f0 5px,#f2f2f0 10px)}
.chip.is-free b{color:var(--tocs)}
.ov-note{margin:14px 0 0; font-size:11.5px; color:var(--tocs)}
.ov-h{font-size:13px; font-weight:700; color:var(--nw)}

.c5z-wait{margin:0; padding:6px 18px 16px; font-size:16px; font-weight:600;
  color:var(--nw); line-height:1.4}
.pickbox{padding:14px 18px 16px; border-top:1px solid var(--line); background:#fff8e8}
.pickbox.quiet{background:#fff}
.pickbox h3{margin:0 0 9px; font-size:11px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:#8a6400}
.pickbox.quiet h3{color:var(--tocs)}
.picklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.picklist li{display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600;
  color:var(--toc)}
.pq{min-width:38px; text-align:center; padding:4px 9px; border-radius:6px;
  background:#f6e2b8; color:#7a5600; font-weight:700; font-variant-numeric:tabular-nums}
.picklist.quiet .pq{background:#eef2f3; color:var(--nw)}

/* campsite photo -------------------------------------------------------- */
.shot{display:block; width:100%; height:auto}
.shot.full{width:auto; max-width:100%; max-height:88vh; border-radius:8px}

/* the nudge ------------------------------------------------------------- */
.nudge{
  position:fixed; z-index:1200; left:1rem; right:1rem;
  bottom:calc(1rem + env(safe-area-inset-bottom,0px));
  max-width:400px; margin:0 auto; padding:18px 18px 16px;
  background:var(--card); color:var(--toc); border-radius:16px;
  box-shadow:0 18px 50px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.06);
  transform:translateY(140%); opacity:0; transition:transform .42s cubic-bezier(.16,1.05,.3,1), opacity .28s;
}
.nudge.up{transform:none; opacity:1}
.nudge-icon{
  width:46px; height:46px; border-radius:14px; background:#25d366;
  display:flex; align-items:center; justify-content:center; margin-bottom:12px;
  box-shadow:0 6px 18px -6px rgba(37,211,102,.9);
}
.nudge-icon svg{width:27px; height:27px; fill:#fff}
.nudge-h{margin:0 0 3px; font-size:18px; font-weight:700; color:var(--nw); letter-spacing:-.2px}
.nudge-b{margin:0 0 14px; font-size:13.5px; line-height:1.45; color:var(--tocs)}
.nudge-cta{
  display:block; padding:13px; border-radius:12px; background:#25d366; color:#0b3d1f;
  text-align:center; text-decoration:none; font-size:16px; font-weight:700;
  letter-spacing:.01em; white-space:nowrap;
}
.nudge-cta:hover{background:#20bd5a; color:#062e16}
.nudge-hours{
  margin:9px 0 0; font-size:12.5px; font-weight:600; color:var(--nw);
  text-align:center; display:flex; align-items:center; justify-content:center; gap:6px;
}
.nudge-hours::before{
  content:""; width:7px; height:7px; border-radius:50%; background:#2f9e57; flex:0 0 auto;
}
.nudge-x{
  position:absolute; top:9px; right:9px; width:30px; height:30px; border:0; border-radius:50%;
  background:rgba(0,0,0,.05); color:var(--tocs); font-size:19px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.nudge-x:hover{background:rgba(0,0,0,.1); color:var(--toc)}
@media (prefers-reduced-motion: no-preference){
  .nudge.up .nudge-icon{animation:ping 2.4s ease-out 3}
  @keyframes ping{
    0%,72%,100%{transform:scale(1)}
    78%{transform:scale(1.12)}
    84%{transform:scale(.97)}
    90%{transform:scale(1.05)}
  }
}
@media (prefers-reduced-motion: reduce){
  .nudge{transition:opacity .2s}
  .nudge.up{transform:none}
}

/* callouts, help, footer ------------------------------------------------- */
.callout{background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25);
  border-radius:var(--radius); padding:12px 14px; margin:1.25rem 0 0; font-size:13px; line-height:1.5}
.callout b{font-weight:700}
.callout code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px}
.help{margin-top:1.75rem}
.help h2{font-size:15px; font-weight:700; margin:0 0 8px; color:var(--tp)}
.help ul{margin:0; padding-left:1.1rem; font-size:13px; line-height:1.5; color:var(--ts)}
.help li{margin:.35rem 0}
.help li b{color:var(--tp); font-weight:600}
.foot{margin-top:1.75rem; padding-top:1rem; border-top:1px solid var(--tl);
  font-size:11.5px; line-height:1.7; color:var(--ts)}
.wa{color:#fff; font-weight:600; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.4);
  white-space:nowrap}
.wa:hover{border-bottom-color:#fff}
.foot p{margin:0}
@media (prefers-reduced-motion: no-preference){
  #out>.card{animation:rise .28s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
}
</style>

var lang="de";
try{ var st=localStorage.getItem("nw-lang"); if(st==="de"||st==="en") lang=st;
     else if((navigator.language||"").slice(0,2).toLowerCase()!=="de") lang="en"; }
catch(e){ if((navigator.language||"").slice(0,2).toLowerCase()!=="de") lang="en"; }

/* --- helpers ----------------------------------------------------------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function el(id){return document.getElementById(id);}
function find(key){                                   // key is "C9:301"
  var bits=String(key).split(":"), a=AREAS[bits[0]];
  if(!a) return null;
  for(var i=0;i<a.tents.length;i++) if(String(a.tents[i].no)===bits[1]) return {a:a,t:a.tents[i]};
  return null;
}

/* --- campsite photo ---------------------------------------------------- */
function photo(a,full){
  if(!a.plan) return "";
  return '<img class="shot'+(full?" full":"")+'" src="'+a.plan+'" width="'+a.w+'" height="'+a.h+
         '" alt="'+esc(a.name)+'" loading="lazy">';
}

/* --- result card ------------------------------------------------------- */
function card(entry,n,total){
  var key=entry[0], pickup=entry[1]==="pickup", hit=find(key), L=t();
  if(!hit) return '<article class="card"><p class="tent-no">'+esc(String(key).split(":")[1]||"?")+'</p>'+
                  '<p class="tent-sub">'+esc(L.unknown)+'</p></article>';
  var a=hit.a, x=hit.t, key=a.key+":"+x.no;
  return '<article class="card'+(pickup?" is-pickup":"")+'">'+
   (total>1 ? '<div class="res-hd"><span class="idx">'+esc(L.idx(n,total))+'</span></div>' : '')+
   '<p class="tent-eyebrow">'+esc(pickup?L.pickup:L.tent)+'</p>'+
   '<p class="tent-no">'+esc(x.no)+'</p>'+
   '<p class="tent-sub">'+esc(pickup?L.pickupSub:L.sub)+'</p>'+
   '<dl class="facts">'+
     '<div><dt>'+esc(L.camping)+'</dt><dd>'+esc(a.key)+'</dd></div>'+
   '</dl>'+
   (CHECK ? checkBlock(key, L) : '')+
   '<p class="addon">'+esc(L.addon)+'</p>'+
   (a.geo ? '<a class="route" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q='+
     a.geo[0]+','+a.geo[1]+'">'+esc(L.route)+'</a>' : '')+
   (a.plan ? '<figure class="map"><button type="button" class="planbtn" data-key="'+esc(key)+'" '+
     'aria-label="'+esc(L.tap)+'">'+photo(a,false)+'</button>'+
     '<figcaption>'+esc(a.name)+' · '+esc(L.tap)+'</figcaption></figure>' : '')+
   '</article>';
}

/* --- check-in ----------------------------------------------------------
   Needs the /api/checkin function (Vercel). Served as a plain static file
   there is nowhere to write to, so CHECK stays null and no check-in UI is
   rendered at all — the page still works, it just does less. -------------- */
var CHECK=null;
function loadCheck(){
  return fetch("api/checkin",{headers:{Accept:"application/json"}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ CHECK = j && j.tents ? j.tents : null; })
    .catch(function(){ CHECK=null; });
}
function checkIn(key,how){                 // how: "in" | "out" | "undo"
  var body={tent:key};
  if(how==="out") body.out=true;
  if(how==="undo") body.undo=true;
  return fetch("api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},
                              body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(){
      if(!CHECK) CHECK={};
      if(how==="undo") delete CHECK[key];
      else if(how==="out") CHECK[key]={i:(CHECK[key]&&CHECK[key].i)||Date.now(), o:Date.now()};
      else CHECK[key]={i:Date.now()};
    });
}
function state(key){                       // "" | "in" | "out"
  var r=CHECK && CHECK[key];
  if(!r) return "";
  return r.o ? "out" : "in";
}

/* --- overview, for the addresses in ADMINS ------------------------------ */
function overview(){
  var L=t(), tot=0, bk=0, inn=0, out=0, body="";
  Object.keys(OVERVIEW).forEach(function(k){
    var a=OVERVIEW[k], n=a.tents.length, b=0;
    var chips=a.tents.map(function(x){
      if(x.pos) b++;
      var st=state(k+":"+x.no);
      if(st==="in") inn++; else if(st==="out") out++;
      return '<li class="chip'+(st?" is-"+st:"")+(x.pos?"":" is-free")+'">'+
             '<b>'+esc(x.no)+'</b><span>'+esc(x.pos && x.pos!=="-" ? x.pos : (x.pos?"":L.free))+'</span></li>';
    }).join("");
    tot+=n; bk+=b;
    body+='<div class="ov-site"><h3>'+esc(a.name)+' <span>'+n+'</span></h3><ul class="chips">'+chips+'</ul></div>';
  });
  return '<article class="card admin">'+
    '<div class="res-hd"><span class="ov-h">'+esc(L.allH)+'</span>'+
      '<span class="idx">'+esc(L.allSum(tot,bk))+(CHECK?" · "+esc(L.inCount(inn,out)):"")+'</span></div>'+
    '<div class="ov">'+body+'<p class="ov-note">'+esc(L.allNote)+'</p></div></article>';
}

function checkBlock(key, L){
  var st=state(key);
  if(st==="out") return '<p class="checked out">'+esc(L.checkedOut)+'</p>';
  if(st==="in"){
    if(leaving===key){
      return '<div class="leave"><p class="leave-q">'+esc(L.coQ)+'</p>'+
        '<div class="leave-btns"><button type="button" class="checkout" data-out="'+esc(key)+'">'+
        esc(L.coYes)+'</button>'+
        '<button type="button" class="leave-no" data-no="'+esc(key)+'">'+esc(L.coNo)+'</button></div></div>';
    }
    return '<p class="checked">'+esc(L.checkedIn)+'</p>'+
           '<p class="remind">'+esc(L.remind)+'</p>'+
           '<button type="button" class="checkout ask" data-ask="'+esc(key)+'">'+esc(L.checkout)+'</button>';
  }
  return '<button type="button" class="checkin" data-key="'+esc(key)+'">'+esc(L.checkin)+'</button>';
}

/* --- C5Z: no map, no number until the booth hands one out ---------------- */
var ASSIGNED=[];
function loadAssigned(hash){
  return fetch("api/assign",{headers:{Accept:"application/json"}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      var a=(j&&j.assign)||{};
      ASSIGNED=Object.keys(a).filter(function(no){ return a[no].h===hash; })
                            .sort(function(x,y){ return x-y; });
    })
    .catch(function(){ ASSIGNED=[]; });
}
function c5zCard(g){
  var L=t();
  var booked=Object.keys(g.t||{}).map(function(k){ return (g.t[k]>1?g.t[k]+"× ":"")+k; }).join(" · ");
  var pick = (g.p&&g.p.length)
    ? '<ul class="picklist">'+g.p.map(function(a){
        return '<li><span class="pq">'+a[1]+'×</span>'+esc(a[0])+'</li>'; }).join("")+'</ul>'
    : '<p class="tent-sub" style="padding:0">'+esc(L.pickNone)+'</p>';
  var addons = (g.a&&g.a.length)
    ? '<ul class="picklist quiet">'+g.a.map(function(a){
        return '<li><span class="pq">'+a[1]+'×</span>'+esc(a[0])+'</li>'; }).join("")+'</ul>'
    : "";
  return '<article class="card">'+
    '<p class="tent-eyebrow">'+esc(L.c5zTitle)+'</p>'+
    (ASSIGNED.length
      ? '<p class="tent-no">'+esc(ASSIGNED.join(" · "))+'</p>'+
        '<p class="tent-sub">'+esc(L.sub)+'</p>'
      : '<p class="c5z-wait">'+esc(L.c5zNo)+'</p>')+
    (booked?'<dl class="facts"><div><dt>'+esc(L.c5zBooked)+'</dt><dd class="sm">'+
      esc(booked)+'</dd></div></dl>':'')+
    '<div class="pickbox"><h3>'+esc(L.pickH)+'</h3>'+pick+'</div>'+
    (addons?'<div class="pickbox quiet"><h3>'+esc(L.addonH)+'</h3>'+addons+'</div>':'')+
    (a_geo()?'<a class="route" target="_blank" rel="noopener noreferrer" href="'+a_geo()+'">'+
      esc(L.route)+'</a>':'')+
    '</article>';
}
function a_geo(){ return ""; }

/* --- lightbox ---------------------------------------------------------- */
function openPlan(key){
  var hit=find(key); if(!hit || !hit.a.plan) return;
  el("lbBody").innerHTML=photo(hit.a,true);
  el("lbClose").setAttribute("aria-label",t().close);
  el("lb").classList.add("active");
  document.body.classList.add("locked");
  el("lbClose").focus();
}
function closePlan(){
  el("lb").classList.remove("active");
  document.body.classList.remove("locked");
  el("lbBody").innerHTML="";
}
el("lb").addEventListener("click",function(e){ if(e.target===el("lb")) closePlan(); });
el("lbClose").addEventListener("click",closePlan);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closePlan(); });

/* --- render ------------------------------------------------------------ */
var shown=null, c5zHit=null, isAdmin=false, leaving=null, tries=0, blockedUntil=0;
function render(){
  var box=el("out");
  box.innerHTML="";
  if(c5zHit){
    box.innerHTML=c5zCard(c5zHit)+
      '<button type="button" class="again" id="again">'+esc(t().again)+'</button>';
    el("again").addEventListener("click",function(){
      c5zHit=null; shown=null; render(); el("msg").textContent=""; el("msg").className="msg";
      el("email").value=""; el("email").focus(); window.scrollTo({top:0,behavior:"smooth"});
    });
    return;
  }
  if(!shown) return;
  box.innerHTML=shown.map(function(e,i){return card(e,i+1,shown.length);}).join("")+
    (isAdmin?overview():"")+
    '<button type="button" class="again" id="again">'+esc(t().again)+'</button>';
  [].forEach.call(box.querySelectorAll(".planbtn"),function(b){
    b.addEventListener("click",function(){ openPlan(b.getAttribute("data-key")); });
  });
  [].forEach.call(box.querySelectorAll(".checkin"),function(b){
    b.addEventListener("click",function(){
      b.disabled=true;
      checkIn(b.getAttribute("data-key"),"in").then(render).catch(function(){
        b.disabled=false; b.textContent=t().checkFail;
      });
    });
  });
  [].forEach.call(box.querySelectorAll("[data-ask]"),function(b){
    b.addEventListener("click",function(){ leaving=b.getAttribute("data-ask"); render(); });
  });
  [].forEach.call(box.querySelectorAll("[data-no]"),function(b){
    b.addEventListener("click",function(){ leaving=null; render(); });
  });
  [].forEach.call(box.querySelectorAll("[data-out]"),function(b){
    b.addEventListener("click",function(){
      b.disabled=true;
      checkIn(b.getAttribute("data-out"),"out").then(function(){ leaving=null; render(); })
        .catch(function(){ b.disabled=false; b.textContent=t().checkFail; });
    });
  });
  el("again").addEventListener("click",function(){
    shown=null; c5zHit=null; isAdmin=false; render(); el("msg").textContent=""; el("msg").className="msg";
    el("email").value=""; el("email").focus();
    window.scrollTo({top:0, behavior:"smooth"});
  });
}
function apply(){
  var L=t();
  document.documentElement.lang=lang;
  document.title=L.title;
  el("h1").textContent=L.h1;
  el("intro").textContent=L.intro;
  el("lab").textContent=L.label;
  el("email").placeholder=L.ph;
  el("go").textContent=L.submit;
  el("helpH").textContent=L.helpH;
  el("helpL").innerHTML=L.help.map(function(s){return "<li>"+s+"</li>";}).join("");
  el("nudgeH").textContent=L.lostH;
  el("nudgeB").textContent=L.lostB;
  el("nudgeHours").textContent=L.hours.replace("%h",DATA.contact.hours);
  var cta=el("nudgeCta");
  cta.href="https://wa.me/"+DATA.contact.wa;
  cta.textContent=DATA.contact.phone;
  var wa='<a class="wa" href="https://wa.me/'+esc(DATA.contact.wa)+'" target="_blank" '+
         'rel="noopener noreferrer">'+esc(DATA.contact.phone)+'</a>';
  el("foot").innerHTML=L.foot.replace("%name",esc(DATA.contact.name)).replace("%wa",wa)
                             .replace("%hours",esc(L.hours.replace("%h",DATA.contact.hours)));
  el("addonTop").textContent=L.addon;
  var d=el("demo");
  if(d) d.innerHTML=L.demo.replace("%s",esc(DATA.sample));
  [].forEach.call(document.querySelectorAll(".lang button"),function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-lang")===lang));
  });
  var m=el("msg");
  if(m.dataset.key) m.textContent = m.dataset.key==="found" ? L.found(Number(m.dataset.n)) : L[m.dataset.key];
  render();
}
[].forEach.call(document.querySelectorAll(".lang button"),function(b){
  b.addEventListener("click",function(){
    lang=b.getAttribute("data-lang");
    try{ localStorage.setItem("nw-lang",lang); }catch(e){}
    apply();
  });
});

/* --- the nudge: Alex on WhatsApp, five seconds in ----------------------- */
var nudged=false;
try{ nudged=sessionStorage.getItem("nw-nudge")==="1"; }catch(e){}
function nudge(show){
  var n=el("nudge");
  if(show){ n.hidden=false; requestAnimationFrame(function(){ n.classList.add("up"); }); }
  else{
    n.classList.remove("up"); nudged=true;
    try{ sessionStorage.setItem("nw-nudge","1"); }catch(e){}
    setTimeout(function(){ n.hidden=true; }, 300);
  }
}
el("nudgeX").addEventListener("click",function(){ nudge(false); });
el("nudgeCta").addEventListener("click",function(){ nudge(false); });
if(!nudged) setTimeout(function(){ if(!nudged) nudge(true); }, 5000);

/* --- lookup ------------------------------------------------------------ */
function say(key,n){
  var m=el("msg");
  m.dataset.key=key; if(n!==undefined) m.dataset.n=n;
  m.className="msg"+(key==="found"?"":" bad");
  m.textContent = key==="found" ? t().found(n) : t()[key];
}
el("finder").addEventListener("submit",function(ev){
  ev.preventDefault();
  var mail=String(el("email").value).trim().toLowerCase(), form=el("finder");
  shown=null; c5zHit=null; isAdmin=false; render(); form.classList.remove("invalid");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){ form.classList.add("invalid"); say("invalid"); return; }
  if(Date.now()<blockedUntil){ say("wait"); return; }
  var h=sha256(SALT+mail), keys=BOOK[h], c5=C5Z[h];
  isAdmin=ADMINS.indexOf(h)>=0;
  if(!keys && c5){
    tries=0; shown=null; c5zHit=c5; say("found",1);
    loadAssigned(h).then(function(){ render();
      if(el("out").firstChild) el("out").firstChild.scrollIntoView({behavior:"smooth",block:"start"}); });
    return;
  }
  c5zHit=null;
  if(!keys){
    isAdmin=false;
    tries++;
    if(tries>=5){ blockedUntil=Date.now()+30000; tries=0; say("wait"); }
    else { say("none"); }
    form.classList.add("invalid");
    return;
  }
  tries=0; shown=keys; say("found",keys.length); render();
  el("out").firstChild.scrollIntoView({behavior:"smooth", block:"start"});
});
apply();
loadCheck().then(function(){ if(CHECK) render(); });
})();
</script>
